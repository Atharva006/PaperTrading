<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DEAC" />
      <stop offset="45%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#9A7836" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Geometric C / Z Monogram Motif -->
  <!-- Outer framing lines -->
  <rect x="6" y="6" width="88" height="88" fill="none" stroke="#C6A15B" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4" />
  
  <!-- Subtle corner brackets -->
  <path d="M 6 18 L 6 6 L 18 6" fill="none" stroke="#C6A15B" stroke-width="2" />
  <path d="M 94 18 L 94 6 L 82 6" fill="none" stroke="#C6A15B" stroke-width="2" />
  <path d="M 6 82 L 6 94 L 18 94" fill="none" stroke="#C6A15B" stroke-width="2" />
  <path d="M 94 82 L 94 94 L 82 94" fill="none" stroke="#C6A15B" stroke-width="2" />
  
  <!-- Central Interlocking Geometric Symbol -->
  <g transform="translate(16, 16)">
    <!-- Main faceted C body -->
    <path d="M 58 10 L 22 10 L 12 20 L 12 48 L 22 58 L 58 58 L 62 48 L 26 48 L 22 44 L 22 24 L 26 20 L 62 20 Z" fill="url(#goldGradient)" filter="url(#goldGlow)" />
    <!-- Dynamic horizontal precision chevron / horizon line -->
    <polygon points="32,34 52,22 46,34 60,34 38,46 44,34" fill="#F5F5F2" fill-opacity="0.95" />
    <!-- Central precision node -->
    <circle cx="34" cy="34" r="2.5" fill="#0B1424" stroke="#E2C889" stroke-width="1.5" />
  </g>
</svg>
