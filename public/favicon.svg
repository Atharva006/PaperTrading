<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C889" />
      <stop offset="50%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#8F6E2C" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142036" />
      <stop offset="100%" stop-color="#0B1424" />
    </linearGradient>
  </defs>
  <!-- Background Shield/Tile -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#C6A15B" stroke-width="1.5" stroke-opacity="0.35"/>
  
  <!-- Subtle Precision Crosshair Marks -->
  <line x1="32" y1="6" x2="32" y2="10" stroke="#C6A15B" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="32" y1="54" x2="32" y2="58" stroke="#C6A15B" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="6" y1="32" x2="10" y2="32" stroke="#C6A15B" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="54" y1="32" x2="58" y2="32" stroke="#C6A15B" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Architectural Geometric Monogram (C / Z Interlocking Precision Path) -->
  <g transform="translate(14, 14)">
    <!-- Outer C / Z facet -->
    <path d="M 32 4 L 8 4 L 4 8 L 4 28 L 8 32 L 32 32 L 34 26 L 12 26 L 10 24 L 10 12 L 12 10 L 34 10 Z" fill="url(#goldGrad)" />
    <!-- Diagonal Precision Diamond / Crosshair core -->
    <polygon points="18,18 24,14 30,18 24,22" fill="#E2C889" fill-opacity="0.9" />
    <circle cx="24" cy="18" r="1.5" fill="#0B1424" />
  </g>
</svg>
